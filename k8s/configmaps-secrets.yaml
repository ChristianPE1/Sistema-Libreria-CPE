apiVersion: v1
kind: Secret
metadata:
  name: database-secret
  namespace: libreria-system
type: Opaque
data:
  # Base64 encoded values
  # POSTGRES_DB: bGlicmVyaWFfZGI= (libreria_db)
  # POSTGRES_USER: YWRtaW4= (admin) 
  # POSTGRES_PASSWORD: cGFzc3dvcmQxMjM= (password123)
  postgres-db: bGlicmVyaWFfZGI=
  postgres-user: YWRtaW4=
  postgres-password: cGFzc3dvcmQxMjM=
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: database-config
  namespace: libreria-system
data:
  POSTGRES_DB: "libreria_db"
  POSTGRES_USER: "admin"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: libreria-system
data:
  DEBUG: "1"
  DATABASE_URL: "postgresql://admin:password123@postgres-service:5432/libreria_db"
  DJANGO_SETTINGS_MODULE: "backend.settings"