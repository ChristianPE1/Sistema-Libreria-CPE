# Prometheus Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - "alert_rules.yml"

    alerting:
      alertmanagers:
        - static_configs:
            - targets: []

    scrape_configs:
      # Prometheus itself
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # Backend Django metrics
      - job_name: 'libreria-backend'
        static_configs:
          - targets: ['backend-service.libreria-system.svc.cluster.local:8000']
        metrics_path: '/metrics/'
        scrape_interval: 15s

      # Kubernetes pods with prometheus annotations
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - libreria-system
                - monitoring
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
            replacement: $1
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: kubernetes_pod_name
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app

      # Kubernetes services
      - job_name: 'kubernetes-services'
        kubernetes_sd_configs:
          - role: service
            namespaces:
              names:
                - libreria-system
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            target_label: service

  alert_rules.yml: |
    groups:
      - name: libreria.rules
        rules:
          - alert: HighPodCPUUsage
            expr: (sum(rate(container_cpu_usage_seconds_total[5m])) by (pod) * 100) > 80
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High CPU usage detected"
              description: "Pod {{ $labels.pod }} CPU usage is above 80%"

          - alert: HighPodMemoryUsage
            expr: (container_memory_usage_bytes / container_spec_memory_limit_bytes * 100) > 80
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High Memory usage detected"
              description: "Pod {{ $labels.pod }} Memory usage is above 80%"

          - alert: PodRestartingTooMuch
            expr: rate(kube_pod_container_status_restarts_total[5m]) > 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Pod is restarting too frequently"
              description: "Pod {{ $labels.pod }} has restarted {{ $value }} times in the last 5 minutes"